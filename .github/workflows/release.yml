name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.vscode_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-x64.tar.gz
          - vscode_target: linux-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-arm64.tar.gz
          - vscode_target: linux-armhf
            runner: ubuntu-22.04
            rust_target: armv7-unknown-linux-gnueabihf
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-armhf.tar.gz
            apt_packages: gcc-arm-linux-gnueabihf
          - vscode_target: alpine-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
            executable: moo-lsp-rs
            archive: moo-lsp-rs-alpine-x64.tar.gz
            apt_packages: musl-tools
          - vscode_target: alpine-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
            executable: moo-lsp-rs
            archive: moo-lsp-rs-alpine-arm64.tar.gz
            apt_packages: musl-tools
          - vscode_target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            executable: moo-lsp-rs
            archive: moo-lsp-rs-darwin-x64.tar.gz
          - vscode_target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            executable: moo-lsp-rs
            archive: moo-lsp-rs-darwin-arm64.tar.gz
          - vscode_target: win32-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            executable: moo-lsp-rs.exe
            archive: moo-lsp-rs-win32-x64.zip
          - vscode_target: win32-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            executable: moo-lsp-rs.exe
            archive: moo-lsp-rs-win32-arm64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install target linker
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.apt_packages }}

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.vscode_target }}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" \
            "dist/${{ matrix.vscode_target }}/${{ matrix.executable }}"

      - name: Create tar archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.vscode_target }}"

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.vscode_target }}" -DestinationPath "${{ matrix.archive }}"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.vscode_target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: "*-*"
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum moo-lsp-rs-* > SHA256SUMS

      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes
