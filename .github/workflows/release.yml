name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Cargo.lock and release tag
        shell: bash
        run: |
          cargo tree --locked >/dev/null

          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version="$(jq --raw-output '.packages[] | select(.name == "moo-lsp-rs") | .version' <<<"${metadata}")"
          lock_version="$(awk '$0 == "name = \"moo-lsp-rs\"" { package = 1; next } package && /^version = / { gsub(/version = |"/, ""); print; exit }' Cargo.lock)"

          if [[ -z "${package_version}" ]]; then
            echo "Could not determine the moo-lsp-rs package version" >&2
            exit 1
          fi

          if [[ "${lock_version}" != "${package_version}" ]]; then
            echo "Cargo.lock version ${lock_version:-<missing>} does not match Cargo.toml version ${package_version}; run cargo check to update Cargo.lock" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v${package_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${package_version}; expected ${expected_tag}" >&2
              exit 1
            fi
          fi

  build:
    name: Build ${{ matrix.vscode_target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-x64.tar.gz
          - vscode_target: linux-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-arm64.tar.gz
          - vscode_target: linux-armhf
            runner: ubuntu-22.04
            rust_target: armv7-unknown-linux-gnueabihf
            executable: moo-lsp-rs
            archive: moo-lsp-rs-linux-armhf.tar.gz
            apt_packages: gcc-arm-linux-gnueabihf
          - vscode_target: alpine-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
            executable: moo-lsp-rs
            archive: moo-lsp-rs-alpine-x64.tar.gz
            apt_packages: musl-tools
          - vscode_target: alpine-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
            executable: moo-lsp-rs
            archive: moo-lsp-rs-alpine-arm64.tar.gz
            apt_packages: musl-tools
          - vscode_target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            executable: moo-lsp-rs
            archive: moo-lsp-rs-darwin-x64.tar.gz
          - vscode_target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            executable: moo-lsp-rs
            archive: moo-lsp-rs-darwin-arm64.tar.gz
          - vscode_target: win32-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            executable: moo-lsp-rs.exe
            archive: moo-lsp-rs-win32-x64.zip
          - vscode_target: win32-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            executable: moo-lsp-rs.exe
            archive: moo-lsp-rs-win32-arm64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Install target linker
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.apt_packages }}

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.vscode_target }}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" \
            "dist/${{ matrix.vscode_target }}/${{ matrix.executable }}"

      - name: Create tar archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.vscode_target }}"

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.vscode_target }}" -DestinationPath "${{ matrix.archive }}"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.vscode_target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  build_wasm:
    name: Build VS Code web
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add wasm32-wasip1-threads

      - name: Install WASI SDK
        env:
          WASI_SDK_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
          WASI_SDK_VERSION: "33.0"
        run: |
          archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${archive}"
          echo "${WASI_SDK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"

      - name: Build WebAssembly language server
        env:
          CC_wasm32_wasip1_threads: ${{ runner.temp }}/wasi-sdk-33.0-x86_64-linux/bin/clang
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-33.0-x86_64-linux
        run: cargo build --locked --release --target wasm32-wasip1-threads

      - name: Create archive
        run: |
          mkdir -p dist/web
          cp target/wasm32-wasip1-threads/release/moo-lsp-rs.wasm dist/web/moo-lsp-rs.wasm
          tar -C dist -czf moo-lsp-rs-web.tar.gz web

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: moo-lsp-rs-web.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-wasm
          path: moo-lsp-rs-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  build_browser:
    name: Build browser
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # renovate: datasource=crate depName=wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build browser language server
        run: wasm-pack build --release --target web --out-dir dist/browser

      - name: Create archive
        run: tar -C dist -czf moo-lsp-rs-browser.tar.gz browser

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: moo-lsp-rs-browser.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-wasm
          path: moo-lsp-rs-browser.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build_wasm, build_browser]
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: "*-*"
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum moo-lsp-rs-* > SHA256SUMS

      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes
