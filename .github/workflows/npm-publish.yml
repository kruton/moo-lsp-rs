name: Publish npm package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @kruton/moo-lsp
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release versions
        shell: bash
        run: |
          cargo tree --locked >/dev/null
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "moo-lsp-rs") | .version')"
          npm_version="$(jq --raw-output '.version' npm/package.json)"
          expected_tag="v${cargo_version}"
          if [[ "${npm_version}" != "${cargo_version}" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Cargo ${cargo_version}, npm ${npm_version}, and tag ${GITHUB_REF_NAME} must agree (expected ${expected_tag})" >&2
            exit 1
          fi

      - name: Install Rust target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Install JavaScript dependencies
        run: npm --prefix npm ci --ignore-scripts

      - name: Install Chromium
        run: npm --prefix npm exec -- playwright install --with-deps chromium

      - name: Build and test package
        run: |
          cargo test --locked --all-targets --all-features
          npm --prefix npm run build
          npm --prefix npm run pack:check
          npm --prefix npm test
          npm --prefix npm run test:types
          npm --prefix npm run test:browser

      - name: Check for an existing publication
        id: existing
        shell: bash
        run: |
          package_version="$(jq --raw-output '.version' dist/npm/package.json)"
          if published_git_head="$(npm view "@kruton/moo-lsp@${package_version}" gitHead --json 2>/dev/null)"; then
            published_git_head="${published_git_head//\"/}"
            if [[ "${published_git_head}" != "${GITHUB_SHA}" ]]; then
              echo "@kruton/moo-lsp@${package_version} already exists from ${published_git_head}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.existing.outputs.skip != 'true'
        working-directory: dist/npm
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi
