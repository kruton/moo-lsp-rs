name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release

  browser:
    name: Build browser WebAssembly language server
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # renovate: datasource=crate depName=wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WebAssembly language server
        run: wasm-pack build --release --target web --out-dir dist/browser

  npm:
    name: Test npm package
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: npm/package-lock.json

      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        # renovate: datasource=crate depName=wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install JavaScript dependencies
        run: npm --prefix npm ci --ignore-scripts

      - name: Install Chromium
        run: npm --prefix npm exec -- playwright install --with-deps chromium

      - name: Build and inspect packed artifact
        run: |
          npm --prefix npm run build
          npm --prefix npm run pack:check

      - name: Test Node.js and declarations
        run: |
          npm --prefix npm test
          npm --prefix npm run test:types

      - name: Test browser bundle
        run: npm --prefix npm run test:browser

  wasm:
    name: Build VS Code WebAssembly language server
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add wasm32-wasip1-threads

      - name: Install WASI SDK
        env:
          WASI_SDK_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
          WASI_SDK_VERSION: "33.0"
        run: |
          archive="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/${archive}"
          echo "${WASI_SDK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"

      - name: Build WebAssembly language server
        env:
          CC_wasm32_wasip1_threads: ${{ runner.temp }}/wasi-sdk-33.0-x86_64-linux/bin/clang
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-33.0-x86_64-linux
        run: cargo build --locked --release --target wasm32-wasip1-threads
