[package]
name = "moo-lsp-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
tower-lsp = "0.20.0"
tokio = { version = "1.53.1", features = ["rt", "io-std", "macros"] }
tree-sitter = "0.26.11"
tree-sitter-lambdamoo = "0.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
