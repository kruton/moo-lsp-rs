[package]
name = "moo-lsp-rs"
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = "1.0.229"
serde_json = "1.0.150"
tree-sitter = "0.26.11"
tree-sitter-lambdamoo = "0.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
